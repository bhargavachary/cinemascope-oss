<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemascope Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="glass-nav">
        <div class="logo">CINEMASCOPE <span class="badge">ARCHIVE</span></div>
        
        <div class="view-toggles">
            <button id="view-grid" class="icon-btn active" title="Mosaic View"><i class="fa-solid fa-border-all"></i></button>
            <button id="view-list" class="icon-btn" title="List View"><i class="fa-solid fa-list"></i></button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Watched">Watched</button>
            <button class="filter-btn" data-filter="Plan to Watch">Planned</button>
            <button class="filter-btn" data-filter="Recommended">Picks</button>
        </div>

        <div class="tools">
            <button id="theme-toggle" class="icon-btn"><i class="fa-solid fa-sun"></i></button>
            
            <div id="local-controls" class="data-controls hidden">
                <button id="export-btn" class="outline-btn"><i class="fa-solid fa-download"></i> CSV</button>
                <label for="import-file" class="outline-btn"><i class="fa-solid fa-upload"></i> Import</label>
                <input type="file" id="import-file" accept=".csv" hidden>
                <button id="edit-mode-btn" class="outline-btn highlight"><i class="fa-solid fa-pen"></i> Edit</button>
            </div>
        </div>
    </nav>

    <main id="main-container">
        <div id="movie-grid" class="grid-container"></div>

        <div id="movie-list" class="list-container hidden">
            <table class="archive-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('title')">Title <i class="fa-solid fa-sort"></i></th>
                        <th onclick="sortTable('year')">Year <i class="fa-solid fa-sort"></i></th>
                        <th onclick="sortTable('type')">Type <i class="fa-solid fa-sort"></i></th>
                        <th onclick="sortTable('rating')">Rating <i class="fa-solid fa-sort"></i></th>
                        <th onclick="sortTable('status')">Status <i class="fa-solid fa-sort"></i></th>
                        <th>Links</th>
                    </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </main>

    <div id="movie-modal" class="modal-backdrop">
        <div class="modal-content">
            <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-hero">
                <div class="hero-overlay"></div>
                <img id="modal-backdrop-img" src="" alt="Backdrop">
                <div class="hero-text">
                    <h1 id="modal-title">Title</h1>
                    <div class="metrics-row">
                        <span class="metric"><i class="fa-solid fa-star"></i> <span id="modal-rating"></span></span>
                        <span class="metric"><i class="fa-solid fa-film"></i> <span id="modal-type"></span></span>
                        <span class="metric"><i class="fa-solid fa-clock"></i> <span id="modal-duration"></span></span>
                        <span class="metric"><i class="fa-solid fa-calendar"></i> <span id="modal-year"></span></span>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <div class="primary-info">
                    <h3>Synopsis</h3>
                    <p id="modal-synopsis" class="synopsis-text"></p>
                    
                    <h3>Critics' Consensus</h3>
                    <div class="critics-box">
                        <i class="fa-solid fa-quote-left"></i>
                        <p id="modal-critics"></p>
                    </div>

                    <h3>Awards &amp; Recognition</h3>
                    <div class="awards-rail" id="modal-awards"></div>
                </div>

                <div class="secondary-info">
                    <div class="info-block">
                        <h4>Status</h4>
                        <span id="modal-status" class="status-pill">Watched</span>
                    </div>
                    
                    <div class="info-block">
                        <h4>Festival History</h4>
                        <ul id="modal-festivals" class="festival-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
